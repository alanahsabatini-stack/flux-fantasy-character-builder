<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Flux Fantasy Character Builder</title>

    <link rel="stylesheet" href="css/style.css">
</head>

<body>
    <h1>Flux Fantasy Character Builder</h1>

    <p>Build your character step by step.</p>

    <section id="specialtySection">
        <h2>Karma Specialty</h2>

        <label for="specialtySelect">Choose your Specialty:</label>

        <select id="specialtySelect">
            <option value="">-- Select a Specialty --</option>
            <option value="Escape Artist">Escape Artist</option>
            <option value="Special Agent">Special Agent</option>
            <option value="Ink Fighter">Ink Fighter</option>
            <option value="Clockbot">Clockbot</option>
        </select>

        <div id="specialtyInfo">
            <p>Select a Specialty to see its starting information.</p>
        </div>
    </section>

    <section id="studySection">
        <h2>Karma Study</h2>

        <label for="studySelect">Choose your Study:</label>

        <select id="studySelect" disabled>
            <option value="">-- Select a Study --</option>
        </select>

        <div id="studyInfo">
            <p>Select a Specialty first.</p>
        </div>
    </section>

    <script src="js/main.js"></script>
</body>
</html>
